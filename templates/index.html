<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard NATS Core - TP1</title>
    
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Vis.js para o mapa topológico -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <style>
        /* Fundo escuro sólido, sem gradientes */
        body {
            background-color: #0f172a; 
            color: #f8fafc;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        /* Estilização do quadro da topologia com fundo sólido */
        #mynetwork {
            width: 100%;
            height: 450px;
            background-color: #1e293b; 
            border: 1px solid #334155;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        /* Cards com cores sólidas e opacas, sem desfoque (blur) */
        .solid-card {
            background-color: #1e293b; 
            border: 1px solid #334155;
        }
    </style>
</head>
<body class="p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Cabeçalho -->
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-extrabold text-green-400 mb-2">
                NATS Core - E-commerce
            </h1>
            <p class="text-slate-400 text-lg">Simulador de Sistemas Distribuídos Orientado a Eventos (TP1)</p>
        </header>

        <!-- Cards de Métricas Globais -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="solid-card p-6 rounded-xl text-center shadow-md">
                <h3 class="text-slate-300 font-semibold mb-1">Taxa de Publicação (In)</h3>
                <p class="text-3xl font-bold text-blue-400"><span id="pub-rate">0</span> <span class="text-sm text-slate-500">msg/s</span></p>
            </div>
            <div class="solid-card p-6 rounded-xl text-center shadow-md">
                <h3 class="text-slate-300 font-semibold mb-1">Taxa de Entrega (Out)</h3>
                <p class="text-3xl font-bold text-green-400"><span id="del-rate">0</span> <span class="text-sm text-slate-500">msg/s</span></p>
            </div>
        </div>

        <!-- Painel Central: Controles e Topologia -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Controles Manuais -->
            <div class="solid-card p-6 rounded-xl shadow-md flex flex-col justify-center space-y-4">
                <h2 class="text-xl font-bold text-white mb-2 border-b border-slate-600 pb-2">Painel de Disparo</h2>
                <p class="text-sm text-slate-400 mb-4">Envie eventos individuais para testar o roteamento do NATS e os Queue Groups.</p>
                
                <button onclick="dispararPedido('orders.payment')" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-semibold transition shadow-sm">
                    + Evento: Pagamento
                </button>
                
                <button onclick="dispararPedido('orders.stock')" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-semibold transition shadow-sm">
                    + Evento: Estoque
                </button>
                
                <button onclick="dispararPedido('orders.notification')" class="w-full py-3 bg-purple-600 hover:bg-purple-500 text-white rounded-lg font-semibold transition shadow-sm">
                    + Evento: Notificação
                </button>

                <div id="status-box" class="mt-4 text-center text-sm font-medium h-6 text-green-400"></div>
            </div>

            <!-- Grafo da Topologia -->
            <div class="lg:col-span-2">
                <div id="mynetwork"></div>
            </div>
        </div>
    </div>

    <!-- Script de Lógica e Renderização -->
    <script>
        // ── Configuração do Vis.js ──
        const nodeOptions = {
            borderWidth: 2,
            font: { color: '#ffffff', face: 'Inter' }
        };

        const nodes = new vis.DataSet([
            { id: 'prod', label: 'Vitrine\n(Produtor)', shape: 'box', color: { background: '#334155', border: '#3b82f6' }, ...nodeOptions },
            { id: 'nats', label: 'NATS Core\n(Em Memória)', shape: 'ellipse', color: { background: '#064e3b', border: '#10b981' }, font: {size: 16, color: '#fff', bold: true} },
            { id: 'pay', label: 'Subject: pagamento\n(0 workers)', shape: 'box', color: { background: '#334155', border: '#f59e0b' }, ...nodeOptions },
            { id: 'stock', label: 'Subject: estoque\n(0 workers)', shape: 'box', color: { background: '#334155', border: '#f59e0b' }, ...nodeOptions },
            { id: 'notif', label: 'Subject: notificacao\n(0 workers)', shape: 'box', color: { background: '#334155', border: '#f59e0b' }, ...nodeOptions }
        ]);

        const edges = new vis.DataSet([
            { id: 'e1', from: 'prod', to: 'nats', arrows: 'to', color: { color: '#64748b' }, width: 2 },
            { id: 'e2', from: 'nats', to: 'pay', arrows: 'to', color: { color: '#64748b' }, width: 2 },
            { id: 'e3', from: 'nats', to: 'stock', arrows: 'to', color: { color: '#64748b' }, width: 2 },
            { id: 'e4', from: 'nats', to: 'notif', arrows: 'to', color: { color: '#64748b' }, width: 2 }
        ]);

        const container = document.getElementById('mynetwork');
        const data = { nodes: nodes, edges: edges };
        const options = {
            physics: {
                solver: 'repulsion',
                repulsion: { nodeDistance: 150 }
            },
            layout: { hierarchical: { direction: 'LR', sortMethod: 'directed', levelSeparation: 250 } }
        };
        const network = new vis.Network(container, data, options);

        // ── Consumo de Métricas via SSE ──
        const eventSource = new EventSource("/stream");
        
        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if(data.error) {
                console.error("Erro no servidor:", data.error);
                return;
            }

            // Atualiza as métricas globais
            document.getElementById('pub-rate').innerText = Math.round(data.publish_rate);
            document.getElementById('del-rate').innerText = Math.round(data.deliver_rate);

            // Atualiza o texto dos nós
            const payData = data.queues["orders.payment"];
            const stockData = data.queues["orders.stock"];
            const notifData = data.queues["orders.notification"];

            nodes.update({ id: 'pay', label: `Subject: pagamento\n(${payData.consumers} workers)` });
            nodes.update({ id: 'stock', label: `Subject: estoque\n(${stockData.consumers} workers)` });
            nodes.update({ id: 'notif', label: `Subject: notificacao\n(${notifData.consumers} workers)` });

            // Anima as setas se houver tráfego
            animarLinha('e1', data.publish_rate > 0);
            animarLinha('e2', payData.deliver_rate > 0);
            animarLinha('e3', stockData.deliver_rate > 0);
            animarLinha('e4', notifData.deliver_rate > 0);
        };

        function animarLinha(edgeId, ativo) {
            edges.update({ 
                id: edgeId, 
                dashes: ativo, 
                color: { color: ativo ? '#10b981' : '#64748b' },
                width: ativo ? 3 : 2
            });
        }

        // ── Função de Disparo via Botões ──
        function dispararPedido(filaAlvo) {
            fetch('/api/produce', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ count: 1, queue: filaAlvo })
            })
            .then(res => res.json())
            .then(data => {
                const statusBox = document.getElementById('status-box');
                if(data.error) {
                    statusBox.className = "mt-4 text-center text-sm font-medium h-6 text-red-400";
                    statusBox.innerText = data.error;
                } else {
                    statusBox.className = "mt-4 text-center text-sm font-medium h-6 text-green-400";
                    statusBox.innerText = "Evento publicado com sucesso!";
                }
                setTimeout(() => statusBox.innerText = "", 2500);
            });
        }
    </script>
</body>
</html>
