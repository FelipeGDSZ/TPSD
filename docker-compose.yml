x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-healthcheck: &app-healthcheck
  test: ["CMD", "python", "healthcheck.py", "nats"]
  interval: 30s
  timeout: 10s
  retries: 6
  start_period: 30s

services:
  nats:
    image: nats:2.15.0-alpine
    command: ["--name", "nats", "--http_port", "8222"]
    ports:
      - "${NATS_CLIENT_BIND:-0.0.0.0}:4222:4222"
      - "${NATS_MONITOR_BIND:-127.0.0.1}:8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - nats_net

  payment:
    build: .
    command: ["consumer_payment.py"]
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      PROCESS_LOG_EVERY: ${PROCESS_LOG_EVERY:-1}
    healthcheck: *app-healthcheck
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - nats_net

  stock:
    build: .
    command: ["consumer_stock.py"]
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      PROCESS_LOG_EVERY: ${PROCESS_LOG_EVERY:-1}
    healthcheck: *app-healthcheck
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - nats_net

  notification:
    build: .
    command: ["consumer_notification.py"]
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      PROCESS_LOG_EVERY: ${PROCESS_LOG_EVERY:-1}
    healthcheck: *app-healthcheck
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - nats_net

  rpc:
    build: .
    command: ["rpc_server.py"]
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
    healthcheck: *app-healthcheck
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - nats_net

  dashboard:
    build: .
    command: ["-m", "gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--threads", "8", "--timeout", "120", "dashboard:app"]
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_MONITOR_URL: ${NATS_MONITOR_URL:-http://nats:8222}
      FLASK_DEBUG: "0"
    ports:
      - "${DASHBOARD_BIND:-0.0.0.0}:5000:5000"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "dashboard"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - nats_net

networks:
  nats_net:
    driver: bridge
