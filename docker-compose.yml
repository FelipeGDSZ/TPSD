# docker-compose.yml (Versão NATS Core)
# ─────────────────────────────────────────────────────────────────────

services:

  # ── Nó 1 do NATS (Nó Semente / Seed) ─────────────────────────────
  nats1:
    image: nats:latest
    hostname: nats1
    container_name: nats1
    command: >
      --name nats1
      --cluster_name TP01_CLUSTER
      --cluster nats://0.0.0.0:6222
      --http_port 8222
    ports:
      - "4222:4222"    # Porta dos clientes
      - "8222:8222"    # API HTTP de monitoramento
    networks:
      - nats_net

  # ── Nó 2 ─────────────────────────────────────────────────────────
  nats2:
    image: nats:latest
    hostname: nats2
    container_name: nats2
    command: >
      --name nats2
      --cluster_name TP01_CLUSTER
      --cluster nats://0.0.0.0:6222
      --routes nats://nats1:6222
      --http_port 8222
    ports:
      - "4223:4222"
      - "8223:8222"
    networks:
      - nats_net
    depends_on:
      - nats1

  # ── Nó 3 ─────────────────────────────────────────────────────────
  nats3:
    image: nats:latest
    hostname: nats3
    container_name: nats3
    command: >
      --name nats3
      --cluster_name TP01_CLUSTER
      --cluster nats://0.0.0.0:6222
      --routes nats://nats1:6222
      --http_port 8222
    ports:
      - "4224:4222"
      - "8224:8222"
    networks:
      - nats_net
    depends_on:
      - nats1

networks:
  nats_net:
    driver: bridge
