services:
  nats:
    image: nats:2.15.0-alpine
    command: ["--name", "nats", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    networks:
      - nats_net

  payment:
    build: .
    command: ["consumer_payment.py"]
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nats_net

  stock:
    build: .
    command: ["consumer_stock.py"]
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nats_net

  notification:
    build: .
    command: ["consumer_notification.py"]
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nats_net

  rpc:
    build: .
    command: ["rpc_server.py"]
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nats_net

  dashboard:
    build: .
    command: ["dashboard.py"]
    environment:
      NATS_URL: nats://nats:4222
      NATS_MONITOR_URL: http://nats:8222
      FLASK_DEBUG: "0"
    ports:
      - "5000:5000"
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nats_net

networks:
  nats_net:
    driver: bridge
