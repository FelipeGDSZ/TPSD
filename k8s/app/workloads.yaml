apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: tpsd
  labels: &dashboardLabels
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: tpsd
spec:
  replicas: 1
  selector:
    matchLabels: *dashboardLabels
  template:
    metadata:
      labels: *dashboardLabels
    spec:
      nodeSelector:
        tpsd.local/worker: "true"
      terminationGracePeriodSeconds: 30
      containers:
        - name: dashboard
          image: tpsd-jetstream:dev-001
          imagePullPolicy: Never
          args:
            - -m
            - gunicorn
            - --bind
            - 0.0.0.0:5000
            - --workers
            - "1"
            - --threads
            - "8"
            - --timeout
            - "120"
            - dashboard:app
          envFrom:
            - configMapRef:
                name: tpsd-config
          env:
            - name: FLASK_DEBUG
              value: "0"
            - name: DASHBOARD_MAX_PRODUCERS
              value: "2"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: tpsd
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: tpsd
spec:
  selector:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: tpsd
  ports:
    - name: http
      port: 5000
      targetPort: http
