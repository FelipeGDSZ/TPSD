apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: tpsd
  labels: &paymentLabels
    app.kubernetes.io/name: payment
    app.kubernetes.io/part-of: tpsd
spec:
  replicas: 2
  selector:
    matchLabels: *paymentLabels
  template:
    metadata:
      labels: *paymentLabels
    spec:
      nodeSelector: &workerSelector
        tpsd.local/worker: "true"
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints: &spread
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: *paymentLabels
      containers:
        - name: payment
          image: tpsd-jetstream:dev-001
          imagePullPolicy: Never
          args: ["consumer_payment.py"]
          envFrom: &envFrom
            - configMapRef:
                name: tpsd-config
          readinessProbe: &natsReadiness
            exec:
              command: ["python", "healthcheck.py", "nats"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources: &workerResources
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
