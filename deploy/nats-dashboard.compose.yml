name: tpsd-nats

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nats:
    image: nats:2.15.0-alpine
    command: ["--name", "nats", "--http_port", "8222"]
    ports:
      - "${NATS_BIND_IP:?Defina NATS_BIND_IP com o IP privado da VM}:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    networks:
      - nats_net

  dashboard:
    build:
      context: ..
    command: ["-m", "gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--threads", "8", "--timeout", "120", "dashboard:app"]
    environment:
      NATS_URL: nats://nats:4222
      NATS_MONITOR_URL: http://nats:8222
      FLASK_DEBUG: "0"
      DASHBOARD_MAX_PRODUCERS: "2"
    ports:
      - "${DASHBOARD_BIND_IP:-0.0.0.0}:5000:5000"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "dashboard"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    networks:
      - nats_net

networks:
  nats_net:
    driver: bridge
